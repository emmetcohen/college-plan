<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Application plan: Fall 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F4F9; --surface:#FFFFFF; --ink:#12203A; --muted:#5A6781; --line:#D8DFEA;
  --accent:#4A3BB0; --accent-soft:#E7E4FA; --site:#0B7F6A; --site-soft:#DDF3EC;
  --other:#5A6781; --other-soft:#E6EAF1; --warn:#B86A00; --warn-soft:#FFF0D6; --done:#0B7F6A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1424; --surface:#161F35; --ink:#E8EDF7; --muted:#9BA8C2; --line:#26324D;
    --accent:#B0A5FF; --accent-soft:#2A2554; --site:#4FD3AE; --site-soft:#12332F;
    --other:#9BA8C2; --other-soft:#212C45; --warn:#F2B45C; --warn-soft:#3A2C12; --done:#4FD3AE;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1424; --surface:#161F35; --ink:#E8EDF7; --muted:#9BA8C2; --line:#26324D;
  --accent:#B0A5FF; --accent-soft:#2A2554; --site:#4FD3AE; --site-soft:#12332F;
  --other:#9BA8C2; --other-soft:#212C45; --warn:#F2B45C; --warn-soft:#3A2C12; --done:#4FD3AE;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 64px;}
h1,h2,h3{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif;margin:0;letter-spacing:-0.01em;}
h1{font-size:30px;line-height:1.1;font-weight:700;}
.sub{color:var(--muted);margin:6px 0 0;font-size:15px;}
.hero{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;}
.count{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.count .n{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:44px;line-height:1;color:var(--accent);}
.count .l{font-size:15px;color:var(--muted);}
.bar{height:8px;border-radius:99px;background:var(--line);margin-top:14px;overflow:hidden;}
.bar>i{display:block;height:100%;width:0;background:var(--done);border-radius:99px;transition:width .25s ease;}
.prog{font-size:14px;color:var(--muted);margin-top:8px;}
.tabs{display:flex;gap:6px;margin:18px 0 12px;background:var(--other-soft);padding:4px;border-radius:12px;}
.tabs button{flex:1;min-height:44px;padding:0 2px;border:0;background:transparent;color:var(--muted);font:600 14px "Figtree",sans-serif;border-radius:9px;cursor:pointer;}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12);}
button:focus-visible,summary:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--accent);outline-offset:2px;}
.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:0 0 12px;align-items:center;}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;}
.tag.CA{background:var(--accent-soft);color:var(--accent);}
.tag.SITE{background:var(--site-soft);color:var(--site);}
.tag.OTHER{background:var(--other-soft);color:var(--other);}
details.week{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;}
details.week[open]{border-color:var(--accent);}
summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center;min-height:56px;}
summary::-webkit-details-marker{display:none;}
.wk-t{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:18px;line-height:1.2;}
.wk-d{font-size:13px;color:var(--muted);margin-top:2px;}
.wk-c{font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;}
.wk-c.full{color:var(--done);}
.now{font-size:12px;font-weight:600;color:var(--accent);margin-left:6px;}
.tasks{padding:0 8px 8px;}
.task{display:flex;gap:12px;align-items:flex-start;padding:10px 8px;min-height:48px;border-top:1px solid var(--line);cursor:pointer;}
.task:first-child{border-top:0;}
.task input{appearance:none;-webkit-appearance:none;flex:none;width:24px;height:24px;margin:1px 0 0;border:2px solid var(--muted);border-radius:7px;background:transparent;display:grid;place-content:center;cursor:pointer;}
.task input:checked{background:var(--done);border-color:var(--done);}
.task input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px);}
.task .txt{flex:1;font-size:15.5px;}
.task input:checked ~ .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line);}
.task.flag{background:var(--warn-soft);border-radius:10px;border-top-color:transparent;}
.task.flag .txt{font-weight:600;}
.task .tag{margin-top:2px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;}
.card h3{font-size:18px;margin-bottom:6px;}
.card p,.card li{font-size:15px;}
.card ul,.card ol{margin:8px 0 0;padding-left:20px;}
.card li{margin-bottom:6px;}
.note{font-size:13.5px;color:var(--muted);margin:0 0 12px;}
.school{display:block;}
.school .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.school .plan{font-size:13px;color:var(--muted);}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:0 8px;margin-top:6px;}
.steps .task{border-top:0;padding:8px 4px;}
.steps .task .txt{font-size:14.5px;}
.dl{display:grid;gap:4px;padding:12px 0;border-top:1px solid var(--line);}
.dl:first-of-type{border-top:0;}
.dl .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline;}
.dl b{font-weight:600;}
.dl .when{font-weight:600;color:var(--ink);text-align:right;}
.dl .when.typ{color:var(--warn);}
.dl .pl{font-size:14px;color:var(--muted);}
.dl input[type="text"]{width:100%;min-height:44px;margin-top:4px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:0 12px;font:15px "Figtree",sans-serif;}
.reset{margin-top:22px;min-height:44px;padding:0 16px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:10px;font:600 14px "Figtree",sans-serif;cursor:pointer;}
details.sch{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;}
details.sch[open]{border-color:var(--accent);}
.sch .body{padding:0 16px 16px;}
.sch .body h4{font:700 15px "Bricolage Grotesque",sans-serif;margin:16px 0 4px;}
.sch .body ul{margin:6px 0 0;padding-left:20px;}
.sch .body li{font-size:15px;margin-bottom:6px;}
.sch .st{font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;}
.sch .st.full{color:var(--done);}
.sch .tasks{padding:0;}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.cal-h h3{font-size:20px;}
.cal-h button{min-width:44px;min-height:44px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;font:600 20px "Figtree",sans-serif;cursor:pointer;}
.cal-h button:disabled{opacity:.35;cursor:default;}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;}
.dow{font-size:12px;font-weight:600;color:var(--muted);text-align:center;padding:4px 0;}
.day{min-height:52px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;font:500 15px "Figtree",sans-serif;cursor:pointer;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:4px;}
.day.plan{background:var(--accent-soft);border-color:transparent;}
.day.today{border:2px solid var(--accent);font-weight:700;}
.day.sel{background:var(--accent);border-color:var(--accent);color:var(--surface);}
.dots{display:flex;gap:3px;height:7px;}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none;}
.dot.dk{background:var(--warn);}
.dot.tk{background:var(--accent);}
.day.sel .dot{background:var(--surface);}
.key{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:12px 0;align-items:center;}
.key span{display:inline-flex;gap:6px;align-items:center;}
.key .sw{width:14px;height:14px;border-radius:4px;background:var(--accent-soft);}
.ev{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:15.5px;}
.ev:first-of-type{border-top:0;}
.ev .dot{margin-top:7px;}
.ev .lbl{font-size:12px;font-weight:600;color:var(--muted);display:block;}
.go{margin:6px 6px 0 0;min-height:36px;padding:0 12px;border:1px solid var(--line);background:transparent;color:var(--accent);border-radius:99px;font:600 13px "Figtree",sans-serif;cursor:pointer;}
[hidden]{display:none !important;}
@media (prefers-reduced-motion: reduce){.bar>i{transition:none;}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Application plan</h1>
  <p class="sub">Week by week, Fall 2026. Northwestern Early Decision first, everything else after.</p>

  <section class="hero" aria-live="polite">
    <div class="count"><span class="n" id="days">--</span><span class="l" id="daysLabel">days until Northwestern ED (Mon, Nov 2)</span></div>
    <div class="bar" role="progressbar" aria-label="Checklist progress" aria-valuemin="0" aria-valuemax="100" id="barWrap"><i id="bar"></i></div>
    <div class="prog" id="prog"></div>
  </section>

  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="calendar">Calendar</button>
    <button role="tab" aria-selected="false" data-tab="weekly">Weekly</button>
    <button role="tab" aria-selected="false" data-tab="cols">Colleges</button>
    <button role="tab" aria-selected="false" data-tab="dates">Deadlines</button>
  </div>

  <div id="calendar"></div>
  <div id="weekly" hidden></div>
  <div id="cols" hidden></div>
  <div id="dates" hidden></div>

  <button class="reset" id="reset">Clear all checkmarks</button>
</div>

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""); }
function d(str){ var p = str.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function fmt(dt){ return dt.toLocaleDateString(undefined,{month:"short",day:"numeric"}); }

function taskHTML(id, tag, text, flag){
  var chk = state.checks[id] ? " checked" : "";
  return '<label class="task'+(flag?' flag':'')+'"><input type="checkbox" data-id="'+id+'"'+chk+'>' +
         '<span class="txt">'+text+'</span>' +
         (tag ? '<span class="tag '+tag+'">'+TAGNAME[tag]+'</span>' : '') + '</label>';
}

function currentWeekIndex(){
  var now = new Date(); now.setHours(12,0,0,0);
  for (var i=0;i<WEEKS.length;i++){
    var s=d(WEEKS[i].s), e=d(WEEKS[i].e); e.setHours(23,59,59,999);
    if (now>=s && now<=e) return i;
  }
  return now < d(WEEKS[0].s) ? 0 : WEEKS.length-1;
}

function renderWeekly(){
  var cur = currentWeekIndex();
  var h = '<div class="legend"><span>Where to do it:</span><span class="tag CA">Common App</span><span class="tag SITE">School site</span><span class="tag OTHER">Other</span></div>';
  WEEKS.forEach(function(w,i){
    var inner = w.tasks.map(function(t,j){ return taskHTML("w"+i+"-"+j, t[0], t[1], t[2]); }).join("");
    h += '<details class="week" data-week="'+i+'"'+(i===cur?' open':'')+'><summary><div><div class="wk-t">'+w.t+(i===cur?'<span class="now">This week</span>':'')+'</div>' +
         '<div class="wk-d">'+fmt(d(w.s))+' to '+fmt(d(w.e))+'</div></div><div class="wk-c" data-count="'+i+'"></div></summary><div class="tasks">'+inner+'</div></details>';
  });
  document.getElementById("weekly").innerHTML = h;
}

function esc(t){ return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function iso(dt){ return dt.getFullYear()+"-"+("0"+(dt.getMonth()+1)).slice(-2)+"-"+("0"+dt.getDate()).slice(-2); }

 ["2026-11-02","dk","Northwestern Early Decision deadline",["northwestern-university"]],

 ["2027-01-15","dk","Bucknell and Lehigh deadline (about)",["bucknell-university","lehigh-university"]]

var CA_TIPS = [
 "Activities: up to 10, and each description is limited to 150 characters. Put the most important one first and lead with a strong verb.",
 "Honors: up to 5. Put the biggest first.",
 "Set the FERPA waiver before you invite recommenders.",
 "Recommenders: your counselor and 2 teachers. Invite them early and check that each one accepted.",
 "Testing: many schools let you choose whether to send scores. Check each school's policy before you decide.",
 "The Additional Information section is optional. Use it only for context you couldn't fit elsewhere.",
 "Preview the PDF for each school before you submit. You can't edit after you submit."
];

var STEPS_A = [["add","Added to My Colleges, right plan chosen"],["supp","Writing Supplement questions answered"],["rec","Recommenders assigned to this school"]];
var STEPS_B = [["preview","PDF previewed, errors fixed"],["submit","Submitted"],["portal","Portal checked, nothing missing"]];

var RES = "If you're a Florida resident, make sure your residency answers are right. They affect tuition and some scholarships.";
var INFO = {
 "northwestern-university":{ sub:"Oct 30", extra:[["eda","Early Decision agreement signed (you, a parent, your counselor)"],["aid","Financial aid forms done (CSS Profile if required, FAFSA)"]], tips:[
  "Early Decision is binding. Only apply ED if you would attend given an aid offer you can afford. Talk it through with a parent first.",
  "Run the net price calculator before you submit, and read Northwestern's exact rules on being released from ED for financial reasons.",
  "Ask your counselor early to complete their part of the ED agreement.",
  "For the \"why Northwestern\" answer, name specific things: a program, a class, a group. The week of Oct 5 has a task to collect them.",
  "Check Northwestern's aid deadline for ED. It can be different from the application deadline."]},
 "georgia-institute-of-technology":{ sub:"Oct 14", extra:[], tips:[
  "Georgia Tech pays close attention to the major you list. Choose the one you really want, and check whether it is more competitive.",
  "Early Action is not binding, so applying early costs you nothing.",
  "The supplement answers are short. Answer directly and be specific.",
  "Submit a day early to leave room for a portal problem."]},
 "purdue-university":{ sub:"Oct 30", extra:[], tips:[
  "Purdue admits by major, so your first-choice major matters. Check whether you can list a second choice.",
  "Look up the course requirements for your intended major.",
  "Early Action is not binding. Confirm the deadline and when decisions come out."]},
 "virginia-tech":{ sub:"Nov 12", extra:[], tips:[
  "Virginia Tech asks for your first-choice major. Some are much harder to get into, so read the requirements.",
  "Confirm the early deadline on their site. Your plan assumes about Nov 15.",
  "Honors and scholarships can have separate deadlines. Check the site."]},
 "university-of-minnesota-twin-cities":{ sub:"Oct 30", extra:[], tips:[
  "You apply to a specific college within the university. Check which one fits your major and its requirements.",
  "Confirm whether applying by the early date affects scholarship or honors consideration.",
  "Honors applications are often separate."]},
 "university-of-florida":{ sub:"Oct 30", extra:[["hon","Honors and scholarship applications checked"]], tips:[
  "Confirm UF's priority date, and whether it affects scholarship or honors consideration.",
  RES,
  "Check what UF wants beyond the Common App, such as an extra short essay or form."]},
 "university-of-central-florida":{ sub:"Oct 30", extra:[["hon","Honors and scholarship applications checked"]], tips:[
  "UCF has priority dates. Confirm the one for you.",
  "The honors college and scholarships usually have their own applications and deadlines.",
  RES]},
 "university-of-south-florida":{ sub:"Oct 30", extra:[["hon","Honors and scholarship applications checked"]], tips:[
  "USF has priority dates. Confirm the one for you.",
  "The honors college and scholarships usually have their own applications and deadlines.",
  RES]},
 "tufts-university":{ sub:"Dec 18", extra:[["art","Checked whether Tufts accepts an optional art or portfolio supplement"]], tips:[
  "Regular Decision deadline is Jan 1. Submit before winter break so you aren't rushing.",
  "Plan on a \"why this school\" answer. Use specific classes, groups, or programs.",
  "Your art and 3D work might fit an optional arts supplement. Check the site for the rules.",
  "Don't switch to a second Early Decision round unless Northwestern releases you."]},
 "carnegie-mellon-university":{ sub:"Dec 18", extra:[["prog","Program-specific requirements checked (portfolio, extra forms)"]], tips:[
  "You apply to a specific college at Carnegie Mellon. Pick carefully and read each college's requirements.",
  "Art, design, and architecture programs need a portfolio. Your AP 2-D Art work and 3D projects may fit. Check the site early for format and deadline.",
  "Look for program-specific forms or earlier deadlines on the site."]},
 "bucknell-university":{ sub:"Dec 18", extra:[], tips:[
  "The deadline is around mid-January, but plan to finish before winter break.",
  "Check whether you choose between its colleges, such as engineering and arts and sciences.",
  "Look up scholarship and honors deadlines."]},
 "lehigh-university":{ sub:"Dec 18", extra:[], tips:[
  "The deadline is around mid-January, but plan to finish before winter break.",
  "Lehigh has separate colleges, such as engineering, business, and arts and sciences. Pick the one that fits and check its requirements.",
  "Look up scholarship and honors deadlines."]}
};
function stepsFor(id){ return STEPS_A.concat(INFO[id].extra.map(function(x){ return [x[0], x[1]]; }), STEPS_B); }

var calState = { y:2026, m:8, sel:"2026-09-28" };
var PLAN_START = "2026-09-28", PLAN_END = "2027-01-17";
function weekFor(k){ for (var i=0;i<WEEKS.length;i++) if (k>=WEEKS[i].s && k<=WEEKS[i].e) return i; return -1; }
function schoolName(id){ for (var i=0;i<SCHOOLS.length;i++) if (slug(SCHOOLS[i][0])===id) return SCHOOLS[i][0]; return id; }

function renderCal(){
  var first = new Date(calState.y, calState.m, 1), dim = new Date(calState.y, calState.m+1, 0).getDate();
  var idx = calState.y*12+calState.m, atMin = idx <= 2026*12+8, atMax = idx >= 2027*12+0;
  var today = iso(new Date());
  var h = '<div class="cal-h"><button data-cal="-1" aria-label="Previous month"'+(atMin?' disabled':'')+'>&lsaquo;</button><h3>'+first.toLocaleDateString(undefined,{month:"long",year:"numeric"})+'</h3><button data-cal="1" aria-label="Next month"'+(atMax?' disabled':'')+'>&rsaquo;</button></div><div class="grid">';
  ["S","M","T","W","T","F","S"].forEach(function(x){ h += '<div class="dow" aria-hidden="true">'+x+'</div>'; });
  for (var i=0;i<first.getDay();i++) h += '<div></div>';
  for (var n=1;n<=dim;n++){
    var k = iso(new Date(calState.y, calState.m, n));
    var evs = EVENTS.filter(function(e){ return e[0]===k; });
    var dl = evs.some(function(e){ return e[1]==="dk"; }), tg = evs.some(function(e){ return e[1]==="tk"; });
    var cls = "day" + (k>=PLAN_START && k<=PLAN_END ? " plan" : "") + (k===today ? " today" : "") + (k===calState.sel ? " sel" : "");
    var lab = d(k).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"}) + (evs.length ? ", " + evs.length + (evs.length===1?" event":" events") : "");
    h += '<button class="'+cls+'" data-day="'+k+'" aria-label="'+lab+'"'+(k===calState.sel?' aria-pressed="true"':'')+'><span>'+n+'</span><span class="dots">'+(dl?'<i class="dot dk"></i>':'')+(tg?'<i class="dot tk"></i>':'')+'</span></button>';
  }
  h += '</div><div class="key"><span><i class="dot dk"></i>School deadline</span><span><i class="dot tk"></i>Your target</span><span><i class="sw"></i>Plan weeks</span></div><div id="dayPanel"></div>';
  document.getElementById("calendar").innerHTML = h;
  renderDay();
}

function renderDay(){
  var k = calState.sel, evs = EVENTS.filter(function(e){ return e[0]===k; }), wi = weekFor(k);
  var h = '<div class="card"><h3>'+d(k).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})+'</h3>';
  if (evs.length){
    evs.forEach(function(e){
      h += '<div class="ev"><i class="dot '+e[1]+'"></i><div><span class="lbl">'+(e[1]==="dk"?"School deadline":"Your target")+'</span>'+esc(e[2]);
      if (e[3].length){ h += '<div>'; e[3].forEach(function(id){ h += '<button class="go" data-goto="'+id+'">Tips: '+esc(schoolName(id).replace(/^University of /,"").replace(/ University$/,"").replace("Twin Cities","").trim())+'</button>'; }); h += '</div>'; }
      h += '</div></div>';
    });
  } else h += '<p class="note" style="margin:6px 0 0">No deadlines or targets on this day.</p>';
  if (wi >= 0){
    var w = WEEKS[wi];
    h += '<h3 style="margin-top:16px;font-size:16px">This week: '+w.t+'</h3><p class="note" style="margin:2px 0 6px">'+fmt(d(w.s))+' to '+fmt(d(w.e))+'</p><div class="tasks" style="padding:0">' +
         w.tasks.map(function(t,j){ return taskHTML("w"+wi+"-"+j, t[0], t[1], t[2]); }).join("") + '</div>';
  } else h += '<p class="note" style="margin:12px 0 0">This day is outside your plan (Sep 28 to Jan 17).</p>';
  document.getElementById("dayPanel").innerHTML = h + '</div>';
}

function renderCols(){
  var h = '<details class="sch"><summary><div class="wk-t">Common App tips for every school</div></summary><div class="body"><ul>' +
    CA_TIPS.map(function(t){ return '<li>'+t+'</li>'; }).join("") + '</ul></div></details>' +
    '<p class="note">Tips are general guidance. Check each school\'s admissions site for this year\'s exact rules.</p>';
  SCHOOLS.forEach(function(sc){
    var id = slug(sc[0]), info = INFO[id], dr = DEADLINES.filter(function(r){ return slug(r[0])===id; })[0];
    var steps = stepsFor(id).map(function(st){ return taskHTML("c-"+id+"-"+st[0], "", st[1], false); }).join("");
    h += '<details class="sch" data-sid="'+id+'"><summary><div><div class="wk-t">'+sc[0]+'</div><div class="wk-d">'+sc[1]+'. Deadline: '+dr[2]+'</div></div><div class="st" data-ccount="'+id+'"></div></summary><div class="body">' +
      '<p class="note" style="margin:0"><b>Official deadline:</b> '+dr[2]+(dr[3]?'':' (verify on their site)')+'. <b>Your target to submit:</b> '+info.sub+'.</p>' +
      '<h4>Common App checklist</h4><div class="tasks">'+steps+'</div>' +
      '<h4>Tips</h4><ul>'+info.tips.map(function(t){ return '<li>'+t+'</li>'; }).join("")+'</ul></div></details>';
  });
  document.getElementById("cols").innerHTML = h;
}

function renderDates(){
  var h = '<p class="note">Confirmed dates come from the schools\' 2026-27 listings. Dates marked "About" are typical and may differ this year. Type the date you verify on each school\'s site in the box so you have one list to trust.</p><div class="card">';
  DEADLINES.forEach(function(r){
    var id = slug(r[0]);
    var v = (state.dates[id] || "").replace(/"/g,"&quot;");
    h += '<div class="dl"><div class="row"><b>'+r[0]+'</b><span class="when'+(r[3]?'':' typ')+'">'+r[2]+'</span></div>' +
         '<div class="pl">'+r[1]+'</div>' +
         '<input type="text" data-date="'+id+'" value="'+v+'" placeholder="Verified date from school site" aria-label="Verified deadline for '+r[0]+'"></div>';
  });
  h += '</div>';
  document.getElementById("dates").innerHTML = h;
}

function updateProgress(){
  var total = 0, done = 0;
  WEEKS.forEach(function(w,i){
    var c = 0;
    for (var j=0;j<w.tasks.length;j++){ total++; if (state.checks["w"+i+"-"+j]) { c++; done++; } }
    var el = document.querySelector('[data-count="'+i+'"]');
    if (el){ el.textContent = c+"/"+w.tasks.length; el.className = "wk-c"+(c===w.tasks.length?" full":""); }
  });
  SCHOOLS.forEach(function(sc){
    var id = slug(sc[0]), st = stepsFor(id), c = 0;
    st.forEach(function(x){ total++; if (state.checks["c-"+id+"-"+x[0]]) { c++; done++; } });
    var el = document.querySelector('[data-ccount="'+id+'"]');
    if (el){ el.textContent = c+"/"+st.length; el.className = "st"+(c===st.length?" full":""); }
  });
  var pct = total ? Math.round(done/total*100) : 0;
  document.getElementById("bar").style.width = pct+"%";
  document.getElementById("barWrap").setAttribute("aria-valuenow", pct);
  document.getElementById("prog").textContent = done+" of "+total+" tasks done";
}

function updateCountdown(){
  var target = new Date(2026,10,2,23,59,59);
  var ms = target - new Date();
  var days = Math.ceil(ms/86400000);
  var n = document.getElementById("days"), l = document.getElementById("daysLabel");
  if (ms <= 0){ n.textContent = "0"; l.textContent = "Northwestern ED deadline has passed"; }
  else if (days === 1){ n.textContent = "1"; l.textContent = "day until Northwestern ED (today or tomorrow, check the clock)"; }
  else { n.textContent = days; l.textContent = "days until Northwestern ED (Mon, Nov 2)"; }
}

document.addEventListener("change", function(ev){
  var t = ev.target;
  if (t.matches('input[type="checkbox"][data-id]')){
    var id = t.getAttribute("data-id");
    if (t.checked) state.checks[id] = true; else delete state.checks[id];
    document.querySelectorAll('input[type="checkbox"][data-id]').forEach(function(b){ if (b.getAttribute("data-id")===id) b.checked = t.checked; });
    save(); updateProgress();
  }
});
document.addEventListener("input", function(ev){
  var t = ev.target;
  if (t.matches('input[data-date]')){ state.dates[t.getAttribute("data-date")] = t.value; save(); }
});

function keepScroll(fn){ var y = window.scrollY; fn(); window.scrollTo(0,y); }
var TABS = ["calendar","weekly","cols","dates"];
function showTab(name){
  document.querySelectorAll(".tabs button").forEach(function(x){ x.setAttribute("aria-selected", x.getAttribute("data-tab")===name ? "true" : "false"); });
  TABS.forEach(function(id){ document.getElementById(id).hidden = (id !== name); });
}
document.addEventListener("click", function(ev){
  var el = ev.target.closest ? ev.target : ev.target.parentElement; if (!el) return;
  var tab = el.closest("[data-tab]"), nav = el.closest("[data-cal]"), day = el.closest("[data-day]"), go = el.closest("[data-goto]");
  if (tab){ showTab(tab.getAttribute("data-tab")); return; }
  if (nav){
    var m = calState.m + (+nav.getAttribute("data-cal")), y = calState.y;
    if (m < 0){ m = 11; y--; } if (m > 11){ m = 0; y++; }
    var idx = y*12+m;
    if (idx >= 2026*12+8 && idx <= 2027*12+0){ calState.y = y; calState.m = m; keepScroll(renderCal); }
    return;
  }
  if (day){ calState.sel = day.getAttribute("data-day"); keepScroll(renderCal); return; }
  if (go){
    showTab("cols");
    var det = document.querySelector('details.sch[data-sid="'+go.getAttribute("data-goto")+'"]');
    if (det){ det.open = true; det.scrollIntoView(); }
  }
});

var resetArmed = false, resetTimer = null;
document.getElementById("reset").addEventListener("click", function(){
  var btn = this;
  if (!resetArmed){
    resetArmed = true; btn.textContent = "Tap again to clear all checkmarks";
    resetTimer = setTimeout(function(){ resetArmed = false; btn.textContent = "Clear all checkmarks"; }, 3500);
    return;
  }
  clearTimeout(resetTimer); resetArmed = false; btn.textContent = "Clear all checkmarks";
  state.checks = {}; save();
  document.querySelectorAll('input[type="checkbox"][data-id]').forEach(function(b){ b.checked = false; });
  updateProgress();
});

(function(){
  var t = iso(new Date());
  calState.sel = (t >= PLAN_START && t <= PLAN_END) ? t : PLAN_START;
  var dt = d(calState.sel); calState.y = dt.getFullYear(); calState.m = dt.getMonth();
})();
renderWeekly(); renderCols(); renderDates(); renderCal(); updateProgress(); updateCountdown();
</script>
</body>
</html>
